<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>多画面直播监控室（单文件）</title>
<style>
:root{--sidebar-w:260px;--gap:8px}
html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
.app{display:flex;height:100vh;gap:var(--gap);overflow:hidden}
.sidebar{width:var(--sidebar-w);background:#0f172a;color:#e6eef8;padding:12px;box-sizing:border-box;display:flex;flex-direction:column}
.sidebar h1{font-size:16px;margin:0 0 8px}
.controls{display:flex;gap:8px;margin-bottom:8px}
.controls button{flex:1;padding:8px;border-radius:6px;border:0;background:#111827;color:#fff;cursor:pointer}
.list{overflow:auto;flex:1;border-radius:6px;background:#071025;padding:8px}
.item{padding:8px;border-radius:6px;background:transparent;cursor:pointer;color:#cfe8ff;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.item:hover{background:#0b2540}
.item .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .actions{display:flex;gap:6px}
.small{font-size:12px;opacity:.8}
.main{flex:1;background:#071126;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.toolbar{display:flex;gap:8px;align-items:center}
.toolbar select,.toolbar button{padding:8px;border-radius:6px;border:0;background:#0b1220;color:#fff}
.grid-wrap{flex:1;background:#031022;border-radius:8px;padding:8px;display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:8px;overflow:hidden}
.cell{position:relative;background:#000;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.cell.ghost{background:linear-gradient(90deg,#0b1930,#021b18)}
.cell iframe, .cell video{width:100%;height:100%;object-fit:contain;background:#000}
.cell .label{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;z-index:10}
.cell.focus{z-index:20;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.cell .overlay{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:11}
.overlay button{background:rgba(0,0,0,.5);border:0;color:#fff;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.modal.open{display:flex}
.modal .card{background:#fff;color:#000;padding:16px;border-radius:8px;width:420px;max-width:94%}
.field{display:flex;flex-direction:column;margin-bottom:8px}
.field label{font-size:13px;margin-bottom:4px}
.field input, .field select, .field textarea{padding:8px;border-radius:6px;border:1px solid #d0d7de}
.field textarea{resize:none;height:120px;font-family:monospace}
.muted{font-size:12px;color:#666}
@media (max-width:900px){:root{--sidebar-w:200px}.sidebar{display:none}}
</style>

<!-- 外部 lib：Hls.js / flv.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@latest"></script>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <h1>监控室 — 地址列表</h1>
    <div class="controls">
      <button id="btnAdd">添加</button>
      <button id="btnIO">输入/输出</button>
    </div>
    <div class="list" id="list"></div>
    <div style="margin-top:8px;font-size:12px;color:#9fb8d4">
      提示：点击名称将加入当前视图；右侧编辑可修改/删除。地址保存在浏览器 IndexedDB。
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <label class="small">布局</label>
      <select id="layoutSelect">
        <option value="1">1x1</option>
        <option value="4">2x2</option>
      </select>
      <button id="clearGrid">清空</button>
      <div style="flex:1"></div>
      <button id="saveSnapshot">打开焦点/快照（新窗口）</button>
    </div>

    <div class="grid-wrap" id="grid"></div>
  </main>
</div>

<!-- 添加/编辑弹窗 -->
<div class="modal" id="modal">
  <div class="card">
    <h3 id="modalTitle">添加地址</h3>
    <div class="field">
      <label>名称</label>
      <input id="inName" placeholder="例如：B站-直播间" />
    </div>
    <div class="field">
      <label>类型</label>
      <select id="inType">
        <option value="url">普通链接</option>
        <option value="bilibili">B站直播</option>
        <option value="twitch">Twitch 直播</option>
        <option value="flv">FLV/M3U8 流</option>
      </select>
    </div>
    <div class="field" id="fieldUrl">
      <label>URL</label>
      <input id="inUrl" placeholder="请输入完整 URL" />
    </div>
    <div class="field" id="fieldRoom" style="display:none">
      <label>Room ID</label>
      <input id="inRoom" placeholder="请输入 B站 房间ID" />
    </div>
    <div class="field" id="fieldTwitch" style="display:none">
      <label>Twitch Channel</label>
      <input id="inTwitch" placeholder="请输入 Twitch 频道名" />
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="modalCancel">取消</button>
      <button id="modalOk">保存</button>
    </div>
    <div class="muted" style="margin-top:8px">注意：B站直播请填 Room ID，Twitch 填 Channel Name，普通网站填完整 URL，FLV/M3U8 填直播流 URL。</div>
  </div>
</div>

<!-- IO 弹窗 -->
<div class="modal" id="modalIO">
  <div class="card">
    <h3>输入/输出</h3>
    <div class="field">
      <textarea id="ioArea" placeholder="JSON 导入/导出内容"></textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="ioCancel">取消</button>
      <button id="ioImport">导入</button>
      <button id="ioExport">导出</button>
      <button id="ioDownload">下载TXT</button>
    </div>
    <div class="muted" style="margin-top:8px">导出包括名称和类型，可直接复制或粘贴 JSON 导入。</div>
  </div>
</div>

<script>
/* ------------------------------
   IndexedDB (存储 streams)
   ------------------------------ */
const DB_NAME='multiview-db',DB_STORE='streams';
async function openDB(){ return new Promise((res,rej)=>{ const rq=indexedDB.open(DB_NAME,1); rq.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE,{keyPath:'id'}); }; rq.onsuccess=e=>res(e.target.result); rq.onerror=e=>rej(e.target.error); }); }
async function dbGetAll(){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(DB_STORE,'readonly'); const store=tx.objectStore(DB_STORE); const rq=store.getAll(); rq.onsuccess=e=>res(e.target.result); rq.onerror=e=>rej(e.target.error); }); }
async function dbPut(item){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(DB_STORE,'readwrite'); const store=tx.objectStore(DB_STORE); const rq=store.put(item); rq.onsuccess=e=>res(e.target.result); rq.onerror=e=>rej(e.target.error); }); }
async function dbDel(id){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(DB_STORE,'readwrite'); const store=tx.objectStore(DB_STORE); const rq=store.delete(id); rq.onsuccess=e=>res(); rq.onerror=e=>rej(e.target.error); }); }

/* ------------------------------
   全局状态
   ------------------------------ */
let editingId=null, cells=[], focusedCellId=null;
const listEl=document.getElementById('list');
const gridEl=document.getElementById('grid');
const layoutSelect=document.getElementById('layoutSelect');
const modal=document.getElementById('modal');
const inName=document.getElementById('inName');
const inUrl=document.getElementById('inUrl');
const inRoom=document.getElementById('inRoom');
const inTwitch=document.getElementById('inTwitch');
const inType=document.getElementById('inType');
const modalTitle=document.getElementById('modalTitle');
const fieldUrl=document.getElementById('fieldUrl');
const fieldRoom=document.getElementById('fieldRoom');
const fieldTwitch=document.getElementById('fieldTwitch');

const modalIO=document.getElementById('modalIO');
const ioArea=document.getElementById('ioArea');
const ioCancel=document.getElementById('ioCancel');
const ioImport=document.getElementById('ioImport');
const ioExport=document.getElementById('ioExport');
const ioDownload=document.getElementById('ioDownload');

function uid(){ return 'id-'+Math.random().toString(36).slice(2,9); }

/* ------------------------------
   列表刷新 / IndexedDB 操作 UI 绑定
   ------------------------------ */
async function refreshList(){
  const data=await dbGetAll();
  listEl.innerHTML='';
  data.sort((a,b)=>a.name.localeCompare(b.name)).forEach(it=>{
    const div=document.createElement('div'); div.className='item';
    const name=document.createElement('div'); name.className='name'; name.textContent=it.name; name.title=it.url;
    name.onclick=()=>addToGrid(it);
    const actions=document.createElement('div'); actions.className='actions';
    const btnEdit=document.createElement('button'); btnEdit.textContent='✎'; btnEdit.title='编辑';
    btnEdit.onclick=e=>{ e.stopPropagation(); openModal(it); };
    const btnDel=document.createElement('button'); btnDel.textContent='🗑'; btnDel.title='删除';
    btnDel.onclick=async e=>{ e.stopPropagation(); await dbDel(it.id); refreshList(); };
    actions.appendChild(btnEdit); actions.appendChild(btnDel);
    div.appendChild(name); div.appendChild(actions);
    listEl.appendChild(div);
  });
}

/* 事件绑定： 按钮、弹窗 切换 */
document.getElementById('btnAdd').onclick=()=>openModal();
document.getElementById('modalCancel').onclick=closeModal;
inType.onchange = () => {
  fieldUrl.style.display = fieldRoom.style.display = fieldTwitch.style.display = 'none';
  if(inType.value==='bilibili') fieldRoom.style.display='block';
  else if(inType.value==='twitch') fieldTwitch.style.display='block';
  else fieldUrl.style.display='block';
};

/* 保存地址（自动识别 url 中的 .m3u8/.flv 将类型改为 flv） */
document.getElementById('modalOk').onclick = async () => {
  const name=inName.value.trim();
  let type=inType.value;
  if(!name){ alert('请输入名称'); return; }
  let url='', room='', channel='';
  if(type==='url'){
    url=inUrl.value.trim();
    if(url.includes('.m3u8') || url.includes('.flv')) type='flv';
  } else if(type==='bilibili'){
    room=inRoom.value.trim();
    url=`https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=${room}`;
  } else if(type==='twitch'){
    channel=inTwitch.value.trim();
    const parentDomain = location.protocol==='file:' ? 'localhost' : location.hostname;
    url=`https://player.twitch.tv/?channel=${channel}&parent=${parentDomain}`;
  } else if(type==='flv'){
    url=inUrl.value.trim();
  }

  const id = editingId || uid();
  await dbPut({id,name,type,room,channel,url});
  closeModal();
  await refreshList();
  if(!editingId) addToGrid({id,name,type,room,channel,url});
  editingId = null;
};

function openModal(data){
  modal.classList.add('open');
  fieldUrl.style.display = fieldRoom.style.display = fieldTwitch.style.display = 'none';
  if(data){
    modalTitle.textContent='编辑地址'; editingId=data.id;
    inName.value=data.name; inType.value=data.type||'url';
    if(data.type==='bilibili'){ fieldRoom.style.display='block'; inRoom.value=data.room||''; }
    else if(data.type==='twitch'){ fieldTwitch.style.display='block'; inTwitch.value=data.channel||''; }
    else { fieldUrl.style.display='block'; inUrl.value=data.url||''; }
  } else {
    modalTitle.textContent='添加地址'; editingId=null;
    inName.value=''; inUrl.value=''; inRoom.value=''; inTwitch.value=''; inType.value='url';
    fieldUrl.style.display='block';
  }
}
function closeModal(){ modal.classList.remove('open'); }

/* IO 弹窗 */
document.getElementById('btnIO').onclick = ()=>{ ioArea.value=''; modalIO.classList.add('open'); };
ioCancel.onclick = ()=>{ modalIO.classList.remove('open'); };
ioImport.onclick = async ()=>{ try{ const arr=JSON.parse(ioArea.value); if(!Array.isArray(arr)) throw 0; for(const it of arr){ const id=uid(); await dbPut({id,name:it.name||'untitled',type:it.type||'url',room:it.room||'',channel:it.channel||'',url:it.url||''}); } await refreshList(); alert('导入完成'); modalIO.classList.remove('open'); }catch(e){ alert('解析失败'); } };
ioExport.onclick = async ()=>{ const data=await dbGetAll(); ioArea.value=JSON.stringify(data.map(it=>({name:it.name,type:it.type,room:it.room||'',channel:it.channel||'',url:it.url})),null,2); };
ioDownload.onclick = ()=>{ const blob=new Blob([ioArea.value],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='streams.txt'; a.click(); };

/* 清空/快照 */
document.getElementById('clearGrid').onclick=()=>{ cells.forEach(c=>destroyPlayer(c)); cells=[]; applyLayout(); };
document.getElementById('saveSnapshot').onclick=()=>{ if(focusedCellId){ const c=cells.find(x=>x.id===focusedCellId); if(c) window.open(c.url,'_blank'); } else if(cells.length){ const urls=cells.map(c=>c.url).join('\n'); const w=window.open('about:blank'); w.document.body.innerText=urls; } else alert('没有画面'); };

/* ------------------------------
   布局逻辑（动态调整列数）
   - 当选中 1x1 且实际画面数 >1 时，会自动使用更合理的 cols（例如 2 或 3）
   ------------------------------ */
layoutSelect.onchange = applyLayout;
function applyLayout(){
  let n = parseInt(layoutSelect.value); 
  let total = cells.length;
  let cols;
  if(total === 0){
    cols = {1:1,4:2,9:3,16:4}[n] || 1;
  } else if(total <= n){
    cols = {1:1,4:2,9:3,16:4}[n] || 1;
  } else {
    if(total <= 4) cols = 2;
    else if(total <= 9) cols = 3;
    else cols = 4;
  }
  gridEl.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  renderGrid();
}
/* ------------------------------
   播放器管理
   ------------------------------ */
function addToGrid(entry){ cells.push({ id: uid(), ...entry }); applyLayout(); }

function destroyPlayer(cell){
  try{
    if(cell && cell._hls){ console.log('[HLS] destroy', cell.url); cell._hls.destroy(); cell._hls = null; }
    if(cell && cell._flv){ console.log('[FLV] destroy', cell.url); cell._flv.destroy(); cell._flv = null; }
  }catch(e){ console.warn('destroyPlayer fail', e); }
}

function removeCell(id){
  const cell = cells.find(c=>c.id===id);
  if(cell) destroyPlayer(cell);
  cells = cells.filter(c=>c.id!==id);
  if(focusedCellId===id) focusedCellId=null;
  applyLayout();
}

/* ------------------------------
   渲染 grid 核心（包含视频/iframe、overlay 按钮、事件）
   ------------------------------ */
function renderGrid(){
  gridEl.innerHTML = '';
  for(let i=0;i<cells.length;i++){
    const cell = cells[i];
    const wrapper = document.createElement('div');
    wrapper.className = 'cell';
    wrapper.setAttribute('data-id', cell.id);

    // label
    const label = document.createElement('div'); label.className='label'; label.textContent = cell.name || '';
    wrapper.appendChild(label);

    // overlay buttons (放大/弹出/移除)
    const ov = document.createElement('div'); ov.className='overlay';
    const btnFocus = document.createElement('button'); btnFocus.textContent='放大';
    btnFocus.onclick = e => { e.stopPropagation(); toggleFocus(cell.id); };
    const btnOpen = document.createElement('button'); btnOpen.textContent='弹出';
    btnOpen.onclick = e => { e.stopPropagation(); window.open(cell.url); };
    const btnDel = document.createElement('button'); btnDel.textContent='移除';
    btnDel.onclick = e => { e.stopPropagation(); removeCell(cell.id); };
    ov.appendChild(btnFocus); ov.appendChild(btnOpen); ov.appendChild(btnDel);
    wrapper.appendChild(ov);

    // 内容：video 或 iframe
    if(cell.type === 'flv'){
      const video = document.createElement('video');
      video.controls = true;
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      // 强制样式，确保自适应
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.objectFit = 'contain';
      // 点击视频本身切换播放，不冒泡到 wrapper
      video.addEventListener('click', e => { e.stopPropagation(); if(video.paused) { video.play().catch(()=>{}); } else { video.pause(); } });

      // 绑定 video 事件用于日志
      ['loadedmetadata','play','pause','error','ended'].forEach(ev=>{
        video.addEventListener(ev, ()=> console.log('[VIDEO]', ev, cell.url));
      });

      // HLS or FLV or direct src
      try{
        if(cell.url && cell.url.includes('.m3u8') && window.Hls && Hls.isSupported()){
          console.log('[HLS] 尝试播放', cell.url);
          const hls = new Hls();
          hls.loadSource(cell.url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, ()=>console.log('[HLS] manifest parsed', cell.url));
          hls.on(Hls.Events.ERROR, (evt,data)=>console.log('[HLS ERROR]', data));
          cell._hls = hls;
        } else if(cell.url && cell.url.includes('.flv') && window.flvjs && flvjs.isSupported()){
          console.log('[FLV] 尝试播放', cell.url);
          const flv = flvjs.createPlayer({type:'flv',url:cell.url});
          flv.attachMediaElement(video);
          flv.load();
          // flv.play() 可能被浏览器策略拦截；autoplay + muted 可提高成功率
          flv.play().catch(()=>{});
          flv.on(flvjs.Events.METADATA_ARRIVED, ()=>console.log('[FLV] metadata arrived', cell.url));
          flv.on(flvjs.Events.ERROR, (err)=>console.log('[FLV ERROR]', err));
          cell._flv = flv;
        } else {
          console.log('[VIDEO] 直接设置 src', cell.url);
          video.src = cell.url || '';
        }
      }catch(e){
        console.warn('player create failed', e);
        video.src = cell.url || '';
      }

      wrapper.appendChild(video);
    } else {
      // iframe 内容（普通 URL / Bilibili / Twitch）
      const iframe = document.createElement('iframe');
      iframe.src = cell.url || '';
      iframe.allow = 'autoplay; fullscreen';
      iframe.style.border = '0';
      wrapper.appendChild(iframe);
      // iframe 不应阻塞 overlay 操作：按钮 stopPropagation 已处理
    }

    // wrapper 点击（选择 / 聚焦）—— 但不要拦截视频点击（video 已 stopPropagation）
    wrapper.addEventListener('click', e => {
      // 如果点击的是 overlay 的按钮等（已 stopPropagation），这里只在点击 wrapper 本身或 label 时触发
      if(e.target === wrapper || e.target.classList.contains('label')){
        selectCell(cell.id);
      }
    });

    // 将 wrapper 加入 grid
    gridEl.appendChild(wrapper);
  }

  // 标记 focus
  Array.from(gridEl.children).forEach(ch=>{
    const id = ch.getAttribute('data-id');
    if(id && id === focusedCellId) ch.classList.add('focus');
    else ch.classList.remove('focus');
  });
}

/* 聚焦 / 还原 */
function toggleFocus(id){
  const el = gridEl.querySelector('[data-id="'+id+'"]');
  if(!el) return;
  const is = el.classList.contains('focus');
  document.querySelectorAll('.cell.focus').forEach(x=>x.classList.remove('focus'));
  if(!is){
    el.classList.add('focus');
    focusedCellId = id;
    // 聚焦时把 container 列调为 1 列以放大视图
    gridEl.style.gridTemplateColumns = '1fr';
  } else {
    focusedCellId = null;
    applyLayout();
  }
}
function selectCell(id){ toggleFocus(id); }

/* 初始化 */
refreshList().then(()=>{ applyLayout(); });

</script>
</body>
</html>
