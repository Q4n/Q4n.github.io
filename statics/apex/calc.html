<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神童射箭计算</title>
    <style>
        /* CSS 样式 */
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --background-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
            --success-color: #2ecc71;
            --warning-color: #e67e22;
            --neutral-color: #95a5a6;
            --neutral-hover-color: #7f8c8d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px M_PIx rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: var(--secondary-color);
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 0.9em;
            font-weight: normal;
            color: #777;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--secondary-color);
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        /* *** 新增CSS: 按钮组样式 *** */
        .button-group {
            display: flex;
            gap: 10px; /* 按钮间距 */
        }
        
        .button-group button {
            width: 100%; /* 每个按钮占据一半宽度 */
            padding: 15px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }

        /* *** 新增CSS: 清空按钮样式 *** */
        .btn-secondary {
            background-color: var(--neutral-color);
        }
        .btn-secondary:hover {
            background-color: var(--neutral-hover-color);
        }

        #results {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .result-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid var(--primary-color);
        }
        .result-item h3 { margin: 0 0 10px 0; color: var(--primary-color); }
        .result-item p { margin: 5px 0; line-height: 1.6; }
        .result-item span { font-weight: bold; color: var(--secondary-color); }
        .warning { background-color: #fdf3e6; border-left-color: var(--warning-color); }
        .warning h3 { color: var(--warning-color); }
        .recommendation { background-color: #eaf7ed; border-left-color: var(--success-color); }
        .recommendation h3 { color: var(--success-color); }
    </style>
</head>
<body>

    <div class="container">
        <h1>神童射箭计算程序</h1>
        <h2>仅供学习娱乐！计算结果仅供参考</h2>
        
        <div class="input-group">
            <label for="r">距离 r (m)</label>
            <input type="number" id="r" placeholder="例如: 250" required>
        </div>
        
        <div class="input-group">
            <label for="alpha">角度 alpha (°)</label>
            <input type="number" id="alpha" placeholder="例如: 15" required>
        </div>
        
        <div class="button-group">
            <button onclick="calculate()" class="btn-primary">计算</button>
            <button type="button" onclick="clearInputs()" class="btn-secondary">一键清空</button>
        </div>
        
        <div id="results"></div>
    </div>

<script>
// JavaScript 逻辑
const M_PI = 3.14159265358979323846;

// *** 新增JavaScript函数: 清空输入和结果 ***
function clearInputs() {
    document.getElementById('r').value = '';
    document.getElementById('alpha').value = '';
    document.getElementById('results').innerHTML = '';
}

// 其余所有计算函数保持不变...
function deg2rad(deg) { return deg * M_PI / 180.0; }
function rad2deg(rad) { return rad * 180.0 / M_PI; }
function constrain_theta(theta) {
    if (theta > 90.0) return 90.0;
    if (theta < -90.0) return -90.0;
    return theta;
}
function calculate_k_effective(theta_deg) {
    const k_base = 0.002138;
    const c1 = 8.308074e-4;
    const c2 = 9.296451e-5;
    return k_base * (1 + c1 * theta_deg + c2 * theta_deg * theta_deg);
}
function solve_theta(func, x0, x1) {
    const max_iter = 50;
    const tol = 1e-6;
    let f0 = func(x0);
    let f1 = func(x1);
    for (let i = 0; i < max_iter; ++i) {
        if (Math.abs(f1 - f0) < 1e-12) break;
        let x2 = x1 - f1 * (x1 - x0) / (f1 - f0);
        let f2 = func(x2);
        if (Math.abs(f2) < tol) {
            return { success: true, root: x2 };
        }
        x0 = x1; f0 = f1;
        x1 = x2; f1 = f2;
    }
    return { success: false, root: x1 };
}
function calculate_original_theta(r, alpha_rad, alpha_deg, init_theta_deg) {
    const k_eff = calculate_k_effective(init_theta_deg);
    const func = (theta_rad) => {
        const s = Math.sin(theta_rad);
        return 2 * Math.sin(alpha_rad) * (1 - s * s) - Math.cos(alpha_rad) * (Math.sin(2 * theta_rad) - k_eff * r * Math.cos(alpha_rad));
    };
    const t0 = deg2rad(init_theta_deg - 5.0);
    const t1 = deg2rad(init_theta_deg + 5.0);
    const result = solve_theta(func, t0, t1);
    if (!result.success) {
        return init_theta_deg; 
    }
    return rad2deg(result.root);
}
function calculate_correction_low(p, r, a) {
    let corr = 0.0;
    corr += p[0] * r + p[1] * a*a + p[2] * Math.pow(a, 3) + p[3] * Math.pow(a, 4);
    corr += p[4] * r*r + p[5] * Math.pow(r, 3) + p[6] * r * a + p[7] * r*r * a;
    corr += p[8] * r * a*a + p[9] * Math.sin(a) + p[10] * Math.cos(a) + p[11] * Math.abs(a);
    corr += p[12] * Math.exp(-r / 1000.0) + p[13] * Math.exp(-r / 500.0) + p[14] * Math.exp(-r / 250.0);
    corr += p[15] * Math.exp(-Math.abs(a) / 10.0) + p[16] * Math.exp(-Math.abs(a) / 5.0);
    corr += p[17] * Math.log(r + 1.0) + p[18] * Math.log(Math.abs(a) + 1.0);
    corr += p[19] * Math.sin(r / 100.0) + p[20] * Math.cos(r / 100.0);
    corr += p[21] * Math.sin(a / 10.0) + p[22] * Math.cos(a / 10.0);
    corr += p[23] * Math.tanh(r / 300.0) + p[24] * Math.tanh(a / 5.0);
    corr += p[25] * r * Math.sin(a / 10.0) + p[26] * r * Math.cos(a / 10.0);
    corr += p[27] * Math.sqrt(r) + p[28] * Math.sqrt(Math.abs(a));
    corr += p[29] * Math.exp(-r / 150.0) + p[30] * Math.exp(-r / 100.0);
    if (r < 150) {
        corr += p[31] * (150 - r) / 150.0 + p[32] * Math.sin(M_PI * r / 150.0) + p[33] * Math.cos(M_PI * r / 150.0);
        corr += p[34] * a*a + p[35] * r * a + p[36] * Math.exp(-Math.abs(a) / 3.0) + p[37] * Math.log(r / 150.0 + 0.1);
    }
    return Math.max(-30.0, Math.min(30.0, corr));
}
function calculate_correction_high(p, r, a) {
    let corr = 0.0;
    corr += p[0] * r + p[1] * a*a + p[2] * Math.pow(a, 3) + p[3] * r*r + p[4] * r * a;
    corr += p[5] * Math.sin(deg2rad(a)) + p[6] * Math.cos(deg2rad(a));
    corr += p[7] * Math.sin(deg2rad(2 * a)) + p[8] * Math.cos(deg2rad(2 * a));
    corr += p[9] * Math.exp(-r / 100.0) + p[10] * Math.exp(-r / 200.0) + p[11] * Math.exp(-r / 300.0);
    corr += p[12] * Math.exp(-Math.abs(a) / 5.0) + p[13] * Math.exp(-Math.abs(a) / 10.0) + p[14] * Math.exp(-Math.abs(a) / 15.0);
    corr += p[15] * r * Math.sin(deg2rad(a / 10.0)) + p[16] * r * Math.cos(deg2rad(a / 10.0));
    corr += p[17] * Math.sqrt(r) * Math.tanh(a / 10.0);
    corr += p[18] * ((a > 45.0) ? Math.pow((a - 45.0) / 45.0, 2) : 0.0) + p[19] * ((r > 200.0) ? (r - 200.0) / 100.0 : 0.0);
    return Math.max(-20.0, Math.min(20.0, corr));
}
function calculate() {
    const rInput = document.getElementById('r');
    const alphaInput = document.getElementById('alpha');
    const resultsDiv = document.getElementById('results');
    const r = parseFloat(rInput.value);
    const alpha = parseFloat(alphaInput.value);
    resultsDiv.innerHTML = '';
    if (isNaN(r) || isNaN(alpha)) {
        resultsDiv.innerHTML = `<div class="result-item warning"><h3>输入错误</h3><p>请输入有效的数值 (r 和 alpha)。</p></div>`;
        return;
    }
    const low_params = [
        0.05906051, 0.01922017, -0.09128481, 0.00227226, -0.00034493, 0.00000029, 0.00505409, -0.00009850, 0.00455790, -0.05668212,
        0.01808962, 0.02486718, 0.00000941, 0.01426906, 0.01337904, -0.00347473, 0.00585867, -0.00318687, 0.00620625, -0.01442806,
        0.00265681, 0.01354817, 0.01208332, 0.01058386, -0.00150257, 0.01667214, 0.00983190, -0.00946299, 0.03288948, 0.00304788,
        0.00352337, 0.00714029, -0.00714395, -0.03475796, 0.01317679, 0.08707241, 0.03757451, 0.00491534
    ];
    const high_params = [
        0.31953025, -0.00230637, 0.00030090, 0.00005720, -0.00210798, -0.15638930, 0.72346818, -0.19508769, 0.69479213, 0.43230354,
        0.67890975, 0.60368317, 0.83926671, -1.21558890, -1.10351086, 0.22915913, -0.33235095, 0.26818104, 0.08942329, 1.45841379
    ];
    const alpha_rad = deg2rad(alpha);
    let theta_low_orig = calculate_original_theta(r, alpha_rad, alpha, 20);
    let theta_high_orig = calculate_original_theta(r, alpha_rad, alpha, 60);
    const low_corr = calculate_correction_low(low_params, r, alpha);
    const high_corr = calculate_correction_high(high_params, r, alpha);
    let theta_low_corr = theta_low_orig + low_corr;
    let theta_high_corr = theta_high_orig + high_corr;
    if (isNaN(theta_high_orig)) theta_high_corr = 90.0 - theta_low_corr;
    if (isNaN(theta_low_orig))  theta_low_corr = 90.0 - theta_high_corr;
    theta_low_corr = constrain_theta(theta_low_corr);
    theta_high_corr = constrain_theta(theta_high_corr);
    const format = (val) => isNaN(val) ? 'N/A' : val.toFixed(4);
    let resultsHTML = `
        <div class="result-item">
            <h3>计算结果</h3><p><strong>输入:</strong> r = ${r} m, alpha = ${alpha}°</p><hr>
            <p><strong>低角度 theta:</strong></p>
            <p>原始值: <span>${format(theta_low_orig)}°</span></p>
            <p>校正量: <span>${format(theta_low_corr - theta_low_orig)}°</span></p>
            <p>校正后: <span>${format(theta_low_corr)}°</span></p><hr>
            <p><strong>高角度 theta:</strong></p>
            <p>原始值: <span>${format(theta_high_orig)}°</span></p>
            <p>校正量: <span>${format(theta_high_corr - theta_high_orig)}°</span></p>
            <p>校正后: <span>${format(theta_high_corr)}°</span></p>
        </div>
    `;
    let warningHTML = '';
    const warn = (Math.abs(theta_low_corr) > 90 || Math.abs(theta_high_corr) > 90);
    if (warn) {
        warningHTML += `<div class="result-item warning"><h3>⚠️ 警告</h3><p>检测到角度值超出 ±90° 范围!</p>`;
        if (Math.abs(theta_low_corr) > 90) {
            warningHTML += `<p>建议低角度替代值: <span>${format(90.0 - theta_high_corr)}°</span></p>`;
        }
        if (Math.abs(theta_high_corr) > 90) {
            warningHTML += `<p>建议高角度替代值: <span>${format(90.0 - theta_low_corr)}°</span></p>`;
        }
        warningHTML += '</div>';
    }
    let recommendationHTML = `<div class="result-item recommendation"><h3>✅ 推荐使用值</h3>`;
    if (!warn) {
        recommendationHTML += `<p>低角度 theta = <span>${format(theta_low_corr)}°</span></p>`;
        recommendationHTML += `<p>高角度 theta = <span>${format(theta_high_corr - 2)}°</span> (已减去2°作为参考)</p>`;
    } else {
        if (Math.abs(theta_low_corr) > 90)
            recommendationHTML += `<p>低角度 theta = <span>${format(90.0 - theta_high_corr)}°</span> (替代值)</p>`;
        else
            recommendationHTML += `<p>低角度 theta = <span>${format(theta_low_corr)}°</span></p>`;
        if (Math.abs(theta_high_corr) > 90)
            recommendationHTML += `<p>高角度 theta = <span>${format(90.0 - theta_low_corr)}°</span> (替代值)</p>`;
        else
            recommendationHTML += `<p>高角度 theta = <span>${format(theta_high_corr)}°</span></p>`;
    }
    recommendationHTML += `</div>`;
    resultsDiv.innerHTML = resultsHTML + warningHTML + recommendationHTML;
}
</script>

</body>
</html>
